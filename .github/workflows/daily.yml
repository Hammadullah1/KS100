name: Daily update and recovery
on:
  schedule:
    - cron: '17 13 * * 1-5'
    - cron: '17 14 * * 1-5'
  workflow_dispatch:
    inputs:
      recovery:
        type: boolean
        default: true
        description: Skip inference if the exchange session already completed
permissions:
  contents: read
concurrency:
  group: psx-durable-state
  cancel-in-progress: false
jobs:
  prepare:
    if: vars.SCHEDULES_ENABLED == 'true' && vars.ACCOUNT_REVIEWED == 'true' && vars.STATE_REPOSITORY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.package.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ vars.STATE_REPOSITORY }}
          token: ${{ secrets.STATE_TOKEN }}
          path: state/private
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.8'
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: uv sync --locked
      - name: Reserve bounded runtime
        run: uv run psx --state state/private budget --job-id "$RUN_KEY" --kind daily
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate snapshot, infer and mature outcomes
        id: update
        continue-on-error: true
        run: |
          if [ "$RECOVERY" = "true" ]; then
            uv run psx --state state/private daily --recovery
          else
            uv run psx --state state/private daily
          fi
        env:
          RECOVERY: ${{ github.event_name == 'schedule' || inputs.recovery }}
        # Provider secrets belong only on an enabled source-fetch step. None are needed for manual imports.
      - name: Build an authorized public bundle
        id: package
        if: vars.PUBLISH_ENABLED == 'true'
        run: |
          uv run psx --state state/private bundle --output web/public/data
          uv run psx verify-bundle --output web/public/data
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Preserve state and publication metadata even after a blocked run
        if: always() && steps.update.outcome != 'skipped'
        run: uv run python scripts/persist_state.py
      - if: steps.package.outputs.ready == 'true'
        run: npm install --global pnpm@10.34.5
      - if: steps.package.outputs.ready == 'true'
        run: pnpm --dir web install --frozen-lockfile
      - if: steps.package.outputs.ready == 'true'
        run: pnpm --dir web build
      - if: steps.package.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: web/dist
          retention-days: 1
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment

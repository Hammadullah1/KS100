name: Weekly candidate research
on:
  schedule:
    - cron: '17 5 * * 6'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [approved, snapshot]
        default: approved
        description: Approved dataset research or private retrospective CSV comparison
permissions:
  contents: read
concurrency:
  group: psx-durable-state
  cancel-in-progress: false
jobs:
  candidate:
    if: (github.event_name == 'workflow_dispatch' || vars.SCHEDULES_ENABLED == 'true') && vars.ACCOUNT_REVIEWED == 'true' && vars.STATE_REPOSITORY != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ vars.STATE_REPOSITORY }}
          token: ${{ secrets.STATE_TOKEN }}
          path: state/private
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.8'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run psx --state state/private budget --job-id "$RUN_KEY" --kind research
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Candidate only; no automatic promotion or final-test opening
        id: research
        continue-on-error: true
        run: |
          if [ "$RESEARCH_MODE" = "snapshot" ]; then
            if [ -f state/private/research-inputs/brent_fred.csv ]; then
              uv run psx snapshot-research --csv state/private/research-inputs/kse100_daily.csv --brent-csv state/private/research-inputs/brent_fred.csv --output "state/private/research/$RUN_KEY/snapshot"
            else
              uv run psx snapshot-research --csv state/private/research-inputs/kse100_daily.csv --output "state/private/research/$RUN_KEY/snapshot"
            fi
          else
            cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            uv run psx --state state/private train --horizon 1 --cutoff "$cutoff" --output "state/private/research/$RUN_KEY/h1"
            uv run psx --state state/private train --horizon 5 --cutoff "$cutoff" --output "state/private/research/$RUN_KEY/h5"
          fi
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          RESEARCH_MODE: ${{ inputs.mode || 'approved' }}
      - if: always() && steps.research.outcome != 'skipped'
        run: uv run python scripts/persist_state.py
      - name: Report research failure after preserving diagnostics
        if: always() && steps.research.outcome == 'failure'
        run: exit 1

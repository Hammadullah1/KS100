name: Local contracts and PWA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: '0.11.8'
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: uv sync --locked
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run pytest --junitxml=reports/ci-pytest.xml
      - run: uv run python scripts/check_workflows.py
      - run: uv run psx --state state/ci fixture
      - run: uv run psx --state state/ci validate
      - run: uv run psx bundle --empty
      - run: uv run python scripts/export_schema.py
      - run: npm install --global pnpm@10.34.5
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web contracts
      - run: git diff --exit-code -- src/psx_pipeline/schemas web/src/bundle.schema.json web/src/contracts.generated.ts
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web e2e

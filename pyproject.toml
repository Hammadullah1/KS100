[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psx-research"
version = "0.1.0"
description = "Availability-aware KSE-100 probability research and an honest offline dashboard"
requires-python = ">=3.10,<3.11"
dependencies = [
    "duckdb==1.5.5",
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
]

[project.scripts]
psx = "psx_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/psx_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "pillow==12.3.0",
    "pytest==9.1.1",
    "ruff==0.16.8",
]


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
